services:
  migrate:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_VERSION: ${CANVAS_BUILD_VERSION:-}
        BUILD_COMMIT: ${CANVAS_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${CANVAS_BUILD_TIME:-unknown}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  yingce-agent:
    image: open-ai-canvas-yingce-agent:server
    build:
      context: .
      dockerfile: yingce-agent/Dockerfile
      args:
        BUILD_VERSION: ${CANVAS_BUILD_VERSION:-}
        BUILD_COMMIT: ${CANVAS_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${CANVAS_BUILD_TIME:-unknown}

  backend:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_VERSION: ${CANVAS_BUILD_VERSION:-}
        BUILD_COMMIT: ${CANVAS_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${CANVAS_BUILD_TIME:-unknown}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  web:
    image: open-ai-canvas-web:server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${CANVAS_BUILD_VERSION:-}
        BUILD_COMMIT: ${CANVAS_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${CANVAS_BUILD_TIME:-unknown}
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
